version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: workcore-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workcore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Application
  app:
    build: .
    container_name: workcore-app
    environment:
      DATABASE_URL: postgresql+asyncpg://workcore_app:workcore_app@postgres:5432/workcore
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/workcore
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: claude-3-5-sonnet-20241022
      LLM_MAX_TOKENS: 1024
      LLM_TIMEOUT_SECONDS: 30
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      DEBUG: "false"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "DATABASE_URL=$$MIGRATION_DATABASE_URL alembic upgrade head &&
             DATABASE_URL=$$MIGRATION_DATABASE_URL python -m src.seed &&
             uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    container_name: workcore-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://workcore_worker:workcore_worker@postgres:5432/workcore
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: claude-3-5-sonnet-20241022
      CLAIM_STALE_SECONDS: 30
      MAX_JOB_RETRIES: 3
      JOB_RETRY_BASE_SECONDS: 2
      JOB_HEARTBEAT_SECONDS: 5
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - .:/app
    command: python -m src.worker

volumes:
  postgres_data: