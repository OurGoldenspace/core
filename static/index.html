<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WorkCore · Maintenance agent</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --line: #2c3846;
      --text: #e8eef4;
      --muted: #93a1b0;
      --accent: #6ea8fe;
      --ok: #3dd68c;
      --warn: #f5c26b;
      --bad: #ff7b72;
      --user: #243044;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 20px 10px;
      border-bottom: 1px solid var(--line);
    }
    h1 { font-size: 1.15rem; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0; font-size: 0.88rem; line-height: 1.4; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip, button {
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      font: inherit;
    }
    .chip {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    #log {
      flex: 1;
      overflow: auto;
      padding: 16px 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 720px;
      padding: 10px 12px;
      border-radius: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .msg.assistant { background: var(--panel); border: 1px solid var(--line); }
    .msg.user { background: var(--user); align-self: flex-end; }
    .msg.tool {
      font-size: 0.82rem;
      color: var(--muted);
      border-left: 3px solid var(--accent);
      background: transparent;
      border-radius: 0;
      padding: 4px 0 4px 10px;
    }
    .approved { color: var(--ok); font-weight: 700; }
    .rejected, .error { color: var(--bad); font-weight: 700; }
    .needs_review { color: var(--warn); font-weight: 700; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 20px 16px;
      border-top: 1px solid var(--line);
    }
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 120px;
      resize: vertical;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    button.send, button.approve {
      border-radius: 10px;
      background: var(--accent);
      color: #081018;
      font-weight: 600;
      padding: 0 16px;
    }
    button.attach {
      border-radius: 10px;
      background: #314155;
      color: var(--text);
      padding: 0 12px;
    }
    .thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--line);
    }
    .msg img.preview {
      max-width: 220px;
      border-radius: 8px;
      display: block;
      margin-bottom: 6px;
    }
    button.approve { background: var(--warn); margin-top: 8px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    details { margin-top: 8px; color: var(--muted); font-size: 0.78rem; }
    details input {
      width: 240px;
      margin-top: 6px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <h1>Maintenance agent</h1>
    <p class="lead">Talk normally. The agent understands the issue, asks only for what it still needs, and can read a photo of the damage when a vision model is configured.</p>
    <div class="chips">
      <button type="button" class="chip" data-fill="Heat is out in 4B">Heat is out in 4B</button>
      <button type="button" class="chip" data-fill="Send Vendor Management Inc">Unapproved contractor</button>
      <button type="button" class="chip" data-fill="Replace the boiler, estimate $7500">Boiler $7500</button>
    </div>
    <details>
      <summary>API key</summary>
      <input id="api-key" value="test-key-12345" autocomplete="off" />
    </details>
  </header>
  <div id="log"></div>
  <form id="chat-form">
    <input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden />
    <button class="attach" id="attach-btn" type="button">Photo</button>
    <img id="thumb" class="thumb" alt="" hidden />
    <textarea id="composer" placeholder="What's going on?"></textarea>
    <button class="send" id="send-btn" type="submit">Send</button>
  </form>
  <script>
    const log = document.getElementById("log");
    const composer = document.getElementById("composer");
    const sendBtn = document.getElementById("send-btn");
    const photoInput = document.getElementById("photo");
    const thumb = document.getElementById("thumb");
    const messages = [];
    let draft = {};
    let lastExecutionId = null;
    let busy = false;
    let pendingImage = null;

    function authHeaders() {
      return {
        Authorization: "Bearer " + document.getElementById("api-key").value.trim(),
        "Content-Type": "application/json",
      };
    }

    function addMessage(role, text, extraClass, imageUrl) {
      const el = document.createElement("div");
      el.className = "msg " + role + (extraClass ? " " + extraClass : "");
      if (imageUrl) {
        const img = document.createElement("img");
        img.className = "preview";
        img.src = imageUrl;
        img.alt = "Attached photo";
        el.appendChild(img);
      }
      if (text) el.appendChild(document.createTextNode(text));
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function addTool(text) {
      addMessage("tool", text);
    }

    async function readSse(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const blocks = buffer.split("\n\n");
        buffer = blocks.pop() || "";
        for (const block of blocks) {
          let eventType = "message";
          const dataLines = [];
          for (const line of block.split("\n")) {
            if (line.startsWith("event:")) eventType = line.slice(6).trim();
            if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
          }
          if (!dataLines.length) continue;
          await onEvent(eventType, JSON.parse(dataLines.join("\n")));
        }
      }
    }

    addMessage(
      "assistant",
      "Tell me what's going on — in your own words, or attach a photo. I'll need a unit, contractor, estimate, and date before I can file a work order."
    );

    document.querySelectorAll("[data-fill]").forEach((chip) => {
      chip.addEventListener("click", () => {
        composer.value = chip.getAttribute("data-fill") || "";
        composer.focus();
      });
    });

    document.getElementById("attach-btn").addEventListener("click", () => photoInput.click());
    photoInput.addEventListener("change", async () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;
      pendingImage = await fileToImage(file);
      thumb.src = "data:" + pendingImage.media_type + ";base64," + pendingImage.data;
      thumb.hidden = false;
    });

    document.getElementById("chat-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = composer.value.trim();
      if ((!text && !pendingImage) || busy) return;
      busy = true;
      sendBtn.disabled = true;
      composer.value = "";
      const image = pendingImage;
      pendingImage = null;
      photoInput.value = "";
      thumb.hidden = true;
      const preview = image ? "data:" + image.media_type + ";base64," + image.data : null;
      addMessage("user", text || "Photo of the issue", "", preview);
      messages.push({ role: "user", content: text || "I attached a photo of the issue." });
      lastExecutionId = null;
      try {
        const response = await fetch("/chat/stream", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ messages, draft, image }),
        });
        if (!response.ok) throw new Error(await response.text());
        let assistantText = "";
        await readSse(response, async (type, data) => {
          if (data.draft) draft = data.draft;
          if (type === "ask" || type === "working") {
            assistantText = data.text;
            addMessage("assistant", data.text);
            messages.push({ role: "assistant", content: data.text });
          }
          if (type === "started") {
            lastExecutionId = data.execution_id;
            addTool("Started PMS checks");
          }
          if (type === "tools") {
            addTool("Tools: " + (data.names || []).join(", "));
          }
          if (type === "decision") {
            lastExecutionId = lastExecutionId || data.execution_id;
            const bubble = addMessage("assistant", data.decision + " — " + data.reason, data.decision);
            messages.push({ role: "assistant", content: bubble.textContent });
            if (data.decision === "needs_review") {
              const button = document.createElement("button");
              button.className = "approve";
              button.type = "button";
              button.textContent = "Approve review";
              button.addEventListener("click", () => approveReview(button));
              bubble.appendChild(document.createElement("br"));
              bubble.appendChild(button);
            }
          }
          if (type === "error") {
            addMessage("assistant", data.reason || "Something went wrong", "error");
          }
        });
        if (!assistantText) {
          /* decision events already rendered */
        }
      } catch (error) {
        addMessage("assistant", String(error.message || error), "error");
      } finally {
        busy = false;
        sendBtn.disabled = false;
        composer.focus();
      }
    });

    composer.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        document.getElementById("chat-form").requestSubmit();
      }
    });

    async function fileToImage(file) {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("Could not read photo"));
        reader.readAsDataURL(file);
      });
      const image = await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Could not load photo"));
        img.src = dataUrl;
      });
      const scale = Math.min(1, 1280 / Math.max(image.width, image.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));
      canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
      const jpeg = canvas.toDataURL("image/jpeg", 0.72);
      return { media_type: "image/jpeg", data: jpeg.split(",")[1] };
    }

    async function approveReview(button) {
      if (!lastExecutionId) return;
      button.disabled = true;
      try {
        const response = await fetch("/executions/" + lastExecutionId + "/approve", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ reviewer: "demo", note: "Approved from chat" }),
        });
        if (!response.ok) throw new Error(await response.text());
        const result = await response.json();
        addMessage("assistant", result.decision + " — " + result.reason, result.decision);
      } catch (error) {
        addMessage("assistant", String(error.message || error), "error");
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
